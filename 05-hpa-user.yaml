apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: medical-erp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # ------------------------------------------------------------------
    # OPTIONAL — custom metric scaling using a label "matchExpressions"
    # selector. This is where matchExpressions actually plugs into an
    # HPA: the label selector on a Pods/External metric source, not on
    # the resource metrics above. Requires a metrics adapter (e.g.
    # Prometheus Adapter) exposing custom.metrics.k8s.io — uncomment
    # only if that's installed on your cluster.
    # ------------------------------------------------------------------
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_requests_per_second
    #       selector:
    #         matchExpressions:
    #           - key: app
    #             operator: In
    #             values:
    #               - user-service
    #           - key: tier
    #             operator: In
    #             values:
    #               - backend
    #     target:
    #       type: AverageValue
    #       averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
