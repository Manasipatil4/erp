# ============================================================================
# Fill in the real values below, then apply with:
#   kubectl apply -f 02a-app-secrets.yaml
#
# NOTE: this file will contain real credentials once filled in. Keep it out
# of git (add it to .gitignore) — don't push it to your repo as-is.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: medical-erp
type: Opaque
stringData:
  # MongoDB Atlas connection strings — one per service DB (users_db, products_db, orders_db)
  USER_MONGO_URI: "mongodb+srv://<user>:<password>@<cluster-host>/users_db?retryWrites=true&w=majority"
  PRODUCT_MONGO_URI: "mongodb+srv://<user>:<password>@<cluster-host>/products_db?retryWrites=true&w=majority"
  ORDER_MONGO_URI: "mongodb+srv://<user>:<password>@<cluster-host>/orders_db?retryWrites=true&w=majority"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: medical-erp
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  # MUST be the same value across main/user/product/order — whichever
  # services sign or verify tokens.
  JWT_SECRET: "<your-generated-secret>"
