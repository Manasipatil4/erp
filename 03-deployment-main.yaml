apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-service
  namespace: medical-erp
  labels:
    app: main-service
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-service
  template:
    metadata:
      labels:
        app: main-service
        tier: frontend
    spec:
      containers:
        - name: main-service
          image: imanasipatilz/frontend  # <-- replace with your image
          imagePullPolicy: Always
          ports:
            - containerPort: 80          # nginx default — this image serves the React build, not Spring Boot
              name: http
          envFrom:
            - configMapRef:
                name: medical-erp-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3