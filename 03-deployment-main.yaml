apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-service
  namespace: medical-erp
  labels:
    app: main-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-service
  template:
    metadata:
      labels:
        app: main-service
        tier: backend
    spec:
      containers:
        - name: main-service
          image: imanasipatilz/medical_erp-frontend  # <-- replace with your image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: medical-erp-config
          # Uncomment if main-service also verifies/signs JWTs (e.g. it's an
          # API gateway sitting in front of user/product/order):
          # env:
          #   - name: JWT_SECRET
          #     valueFrom:
          #       secretKeyRef:
          #         name: jwt-secret
          #         key: JWT_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          # Spring Boot Actuator health groups — enable in application.yml:
          # management.endpoint.health.probes.enabled=true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30      # allow up to 30 * 10s = 5 min for JVM boot
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
