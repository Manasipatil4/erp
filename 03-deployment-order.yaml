apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: medical-erp
  labels:
    app: order-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        tier: backend
    spec:
      containers:
        - name: order-service
          image: imanasipatilz/order-service # <-- replace with your image
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
              name: http
          envFrom:
            - configMapRef:
                name: medical-erp-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: ORDER_MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET

          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          # TCP probes (not HTTP actuator paths) — /actuator/health/liveness
          # returned 404 on this image, meaning the app is up but Spring Boot's
          # health *groups* aren't exposed (needs
          # management.endpoint.health.probes.enabled=true in application.yml
          # to switch back to real health checks). TCP just confirms the port
          # is open, which is enough to unblock rollouts for now.
          startupProbe:
            tcpSocket:
              port: 8083
            failureThreshold: 30      # allow up to 30 * 10s = 5 min for JVM boot
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3